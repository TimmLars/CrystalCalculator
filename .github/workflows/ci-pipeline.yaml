name: CI Pipeline for docker
on: 
    pull_request:
        branches:
            - main
env:
  REGISTRY: "ghcr.io"
  REGISTRY_USERNAME: ${{ github.repository_owner }}
jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
          id-token: write
        steps:
            - name: Checkout the repo
              uses: actions/checkout@v6
            - name: Convert Repo name
              run: echo "REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV" 
            - name: Build docker
              run: docker build -t ${{ env.REGISTRY }}/${{ env.REPO }}:latest .
            - name: docker tag
              run: docker tag ${{ env.REGISTRY }}/${{ env.REPO }}:latest ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}
            - name: show docker images
              run: docker images
            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ env.REGISTRY_USERNAME }}
                  password: ${{ secrets.GITHUB_TOKEN }}
              env:
                REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Push to GHCR
              run: docker push  ${{env.REGISTRY }}/${{ env.REPO }}:latest && docker push ${{env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}
