name: CI Pipeline for docker
on: 
    push:
        branches:
            - main
env:
  REGISTRY: "ghcr.io"
  REGISTRY_USERNAME: ${{ github.repository_owner }}
jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
          IMAGE_NAME: ${{env.REPO }}
        steps:
            - name: Checkout the repo
              uses: actions/checkout@v6
            - name: Test checkout
              run: ls
            - name: Convert Repo name
              run: echo "REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV" 
            - name: Build docker
              run: docker build -t ${{ env.REGISTRY }}/${{ env.REPO }}:latest .
            - name: docker tag
              run: docker tag ${{ env.REGISTRY }}/${{ env.REPO }}:latest ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}
            - name: Test docker
              run: docker images
    push:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ env.REGISTRY_USERNAME }}
                  password: ${{ env.REGISTRY_TOKEN }}
              env:
                REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Push to Docker Hub
              run: docker push  ${{env.REGISTRY }}/${{ needs.build.outputs.IMAGE_NAME }}:latest && docker push ${{env.REGISTRY }}/${{ needs.build.outputs.IMAGE_NAME }}:${{ github.sha }}
